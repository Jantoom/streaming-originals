name: Build and deploy catalogs

on:
  schedule:
    - cron: "17 18 * * *"   # daily at 18:17 UTC (4:17am Brisbane)
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["services.config.mjs", "src/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      # TMDB lookups are cached between runs so daily builds only fetch what changed.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: tmdb-cache-${{ github.run_id }}
          restore-keys: tmdb-cache-

      - name: Build addon
        run: node scripts/build.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
